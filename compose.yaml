name: nest-market

x-laravel: &laravel
  image: nest-market-app:php83
  build:
    context: .
    dockerfile: docker/php/Dockerfile
  working_dir: /var/www/html
  env_file: .env
  environment:
    APP_URL: ${DOCKER_APP_URL:-http://localhost:8082}
    DB_CONNECTION: mysql
    DB_URL: ""
    DB_HOST: mysql
    DB_PORT: 3306
    DB_DATABASE: ${DOCKER_DB_DATABASE:-nest_market}
    DB_USERNAME: ${DOCKER_DB_USERNAME:-nest_market}
    DB_PASSWORD: ${DOCKER_DB_PASSWORD:-nest_local_password}
    SESSION_DRIVER: file
    SESSION_COOKIE: nest_market_docker_session
    CACHE_STORE: file
    QUEUE_CONNECTION: sync
    FILESYSTEM_DISK: public
  volumes:
    - .:/var/www/html
    - vendor_data:/var/www/html/vendor
    - storage_data:/var/www/html/storage
    - bootstrap_cache:/var/www/html/bootstrap/cache
  depends_on:
    mysql:
      condition: service_healthy

services:
  app:
    <<: *laravel
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "php-fpm -t 2>&1 | grep -q successful"]
      interval: 10s
      timeout: 5s
      retries: 10

  nginx:
    image: nginx:1.28-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${APP_PORT:-8082}:80"
    volumes:
      - .:/var/www/html:ro
      - storage_data:/var/www/html/storage:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/up"]
      interval: 10s
      timeout: 5s
      retries: 10

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DOCKER_DB_DATABASE:-nest_market}
      MYSQL_USER: ${DOCKER_DB_USERNAME:-nest_market}
      MYSQL_PASSWORD: ${DOCKER_DB_PASSWORD:-nest_local_password}
      MYSQL_ROOT_PASSWORD: ${DOCKER_DB_ROOT_PASSWORD:-nest_local_root_password}
    ports:
      - "127.0.0.1:${FORWARD_DB_PORT:-13306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysql --protocol=TCP -h127.0.0.1 -u\"$$MYSQL_USER\" -D\"$$MYSQL_DATABASE\" -e 'SELECT 1' >/dev/null 2>&1"]
      start_period: 30s
      interval: 5s
      timeout: 5s
      retries: 30

  setup:
    <<: *laravel
    profiles: ["tools"]
    command: ["sh", "docker/setup.sh"]

volumes:
  mysql_data:
  vendor_data:
  storage_data:
  bootstrap_cache:
